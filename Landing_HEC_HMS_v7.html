<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtuel - Cursos Especializados</title>
    <style>
        :root {
            --color-principal: #E01616; /* Color rojo solicitado */
            --color-oscuro: #1a1a1a;
            --color-fondo: #f9f9f9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--color-fondo);
            color: var(--color-oscuro);
            line-height: 1.6;
        }

        header {
            background-color: #ffffff;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--color-principal);
        }

        /* Estilo para el logo referenciado como archivo externo */
        .logo-virtuel {
            max-height: 50px;
            width: auto;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--color-oscuro);
            margin-left: 20px;
            font-weight: 600;
        }

        .nav-links a:hover {
            color: var(--color-principal);
        }

        .hero {
            padding: 80px 20px;
            text-align: center;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('assets/hero-bg.jpg') no-repeat center center/cover;
            color: #ffffff;
        }

        .hero h1 {
            font-size: 2.8rem;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: var(--color-principal);
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto 30px auto;
        }

        .btn-cta {
            display: inline-block;
            background-color: var(--color-principal);
            color: #ffffff;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease;
        }

        .btn-cta:hover {
            background-color: #b51010;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: var(--color-oscuro);
            color: #ffffff;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <!-- Logo referenciado externamente para que el HTML no pese y se gestione en la carpeta del repositorio -->
        <img src="assets/logo-virtuel.png" alt="Logo de Virtuel" class="logo-virtuel">
        <nav class="nav-links">
            <a href="#cursos">Cursos</a>
            <a href="#beneficios">Beneficios</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Potencia tu futuro con <span>Virtuel</span></h1>
        <p>Aprende ingeniería, tecnología y emprendimiento con cursos especializados diseñados para tu ritmo.</p>
        <a href="#cursos" class="btn-cta">Ver Cursos</a>
    </section>

    <footer>
        <p>&copy; 2026 Virtuel. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
